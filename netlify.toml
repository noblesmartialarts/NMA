[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/nobles-crm-v4.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Family portal: registration reminder emails, daily at 10:05 AM Eastern (15:05 UTC in winter).
[functions."portal-reminders"]
  schedule = "5 15 * * *"
